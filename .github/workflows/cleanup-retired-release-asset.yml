name: Cleanup retired release asset

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the audited retired asset
        env:
          GH_TOKEN: ${{ github.token }}
          RETIRED_ASSET_ID: '467413077'
          RETIRED_ASSET_NAME: cassini-update-macos.zip
          RETIRED_ASSET_DIGEST: sha256:649aa7197c2d4d069bc5a2e62a668000194b515dc593b377d14d48c4da619768
        run: |
          set -euo pipefail
          asset_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$RETIRED_ASSET_ID")"
          jq -e \
            --arg name "$RETIRED_ASSET_NAME" \
            --arg digest "$RETIRED_ASSET_DIGEST" \
            '.name == $name and .digest == $digest' \
            <<<"$asset_json" >/dev/null
          gh api \
            --method DELETE \
            "repos/$GITHUB_REPOSITORY/releases/assets/$RETIRED_ASSET_ID"
